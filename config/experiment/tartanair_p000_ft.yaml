# @package _global_

defaults:
  - override /dataset: tartanair_p000_eval
  - override /model/encoder: resplat
  - override /loss: [mse, lpips]

wandb:
  name: tartanair_house_p000_resplat_from_re10k
  tags: [tartanair, house, p000, stereo, resplat, re10k_init, 320x320]

data_loader:
  train:
    batch_size: 1
  val:
    batch_size: 1
  test:
    batch_size: 1

trainer:
  max_steps: 5000
  num_nodes: 1

model:
  encoder:
    num_depth_candidates: 128
    latent_downsample: 2
    fixed_latent_size: false
    init_gaussian_multiple: 4
    num_refine: 2
    refine_same_num_points: true

checkpointing:
  pretrained_model: pretrained/resplat-base-re10k-256x256-view2-b90d1b53.pth
  no_strict_load: false

optimizer:
  lr: 1.0e-4
  lr_monodepth: 0.0

loss:
  lpips:
    apply_after_step: 0
    weight: 0.05
    perceptual_loss: true

dataset:
  image_shape: [256,256]
  near: 0.1
  far: 50.0
  frame_stride: 1
  frame_start: 0
  max_frames: -1

test:
  eval_time_skip_steps: 5
  compute_scores: true
  save_image: true
  save_video: false
  save_gaussian: false
  save_gaussian_npz: false
  save_gaussian_packet: true
  save_gaussian_packet_stage: both
