defaults:
  - view_sampler: evaluation

name: tartanair

# Use one stereo pair at each selected timestamp as the context packet.
stereo_as_context: true

# For the first demo, evaluate/render only the left target image.
target_camera: left

sequences:
  - scene: P000
    # Replace this with the directory generated by prepare_resplat_zipmap_dataset.py
    # or run_zipmap_resplat_fusion_demo.py, e.g.:
    # /home/shiyo/Desktop/ZipMap/outputs/demo_zipmap_resplat_10/resplat_dataset
    root: /home/shiyo/Desktop/ZipMap/outputs/demo_zipmap_resplat_10/resplat_dataset
    fx: 320.0
    fy: 320.0
    cx: 320.0
    cy: 320.0

left_camera_dirname: image_lcam_front
right_camera_dirname: image_rcam_front

# This pose file is generated from ZipMap pose after Sim(3) alignment.
# The modified DatasetTartanAir computes the right pose from this left pose
# and the fixed stereo rig, so right_pose_filename is intentionally unused.
left_pose_filename: pose.txt
# right_pose_filename: pose_rcam_front.txt

pose_format: tx_ty_tz_qx_qy_qz_qw
pose_matrix_type: Twc

view_sampler:
  # This JSON must index the selected demo frames, not the original full TartanAir sequence.
  index_path: assets/tartanair/zipmap_demo/P000_zipmap_demo10.json
  num_context_views: 1

normalize_intrinsics: true
image_shape: [320, 320]
background_color: [0.0, 0.0, 0.0]
cameras_are_circular: false
overfit_to_scene: null

# The resplat_dataset is already a compact selected subset, so do not stride again here.
frame_start: 0
frame_stride: 1
max_frames: 10
strict_length_check: false

test_len: 10

# These split ratios are irrelevant when using the evaluation sampler,
# but keep them valid for config compatibility.
train_split_ratio: 0.8
val_split_ratio: 0.1
test_split_ratio: 0.1

near: 0.1
far: 50.0
